<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101522">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css">
<title>Halim AI Voice</title>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand-mark">H</div>
    <div><p class="eyebrow">KİŞİSEL SESLENDİRME</p><h1>Halim AI Voice</h1></div>
  </header>
  <section class="voice-card">
    <span class="voice-icon">🎙</span>
    <div><span class="voice-label">SES PROFİLİ</span><strong>Halim'in kendi sesi</strong></div>
    <span class="active-dot" aria-label="Seçili"></span>
  </section>
  <section class="composer">
    <label for="speechText">Seslendirmek istediğin metni yaz</label>
    <textarea id="speechText" maxlength="20000" placeholder="Metnini buraya yaz veya yapıştır…" autofocus></textarea>
    <div class="counter"><span id="charCount">0</span> / 20.000</div>
    <button id="generateButton" class="generate" disabled>Metni kendi sesimle oku</button>
    <p id="status" class="status" aria-live="polite">Kendi sesinle seslendirme motoru henüz bağlanmadı.</p>
  </section>
  <footer>Yalnızca Türkçe · Yalnızca Halim'in sesi</footer>
</main>
<script>
const text=document.getElementById("speechText");
const count=document.getElementById("charCount");
text.addEventListener("input",()=>{count.textContent=text.value.length;});
document.getElementById("generateButton").addEventListener("click",()=>{
 document.getElementById("status").textContent="Ses üretim motoru henüz hazır değil.";
});
if("serviceWorker" in navigator) navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
</script>
</body>
</html>
