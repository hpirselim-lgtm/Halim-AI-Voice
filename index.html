<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101522">
  <meta name="description" content="Halim'in kendi sesiyle Türkçe metin seslendirme uygulaması.">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <title>Halim AI Voice</title>
</head>
<body class="simple-voice-page">
  <main class="simple-voice-app">
    <header class="simple-voice-header">
      <div class="brand-mark" aria-hidden="true">HV</div>
      <h1>Halim AI Voice</h1>
    </header>
    <section class="simple-voice-panel" aria-label="Türkçe metin seslendirme">
      <div class="simple-voice-profile">
        <span class="simple-voice-avatar" aria-hidden="true">H</span>
        <span><strong>Halim'in sesi</strong><small>Sabit ses profili · Türkçe</small></span>
      </div>
      <label class="field-label" for="speechTitle">Metin başlığı</label>
      <input id="speechTitle" maxlength="120" placeholder="Örn. Kara tanker operatörü nasıl olunur?">
      <label class="field-label" for="speechText">Seslendirilecek metin</label>
      <textarea id="speechText" rows="9" maxlength="30000" placeholder="Okutmak istediğin metni buraya yaz…"></textarea>
      <div class="simple-voice-actions">
        <button class="button secondary" id="saveTextButton" type="button">Metni kaydet</button>
        <button class="button primary" id="generateSpeechButton" type="button">Metni kendi sesimle oku</button>
      </div>
      <p id="speechStatus" class="simple-voice-status" role="status" aria-live="polite">Metinlerin ve seslerin bu cihazda saklanır.</p>
      <div id="generatedAudio" class="generated-audio" hidden></div>
    </section>
    <section class="library-panel" aria-labelledby="textLibraryHeading">
      <h2 id="textLibraryHeading">Metin hafızası</h2>
      <div id="savedTexts" class="library-list"><p class="empty">Henüz kaydedilmiş metin yok.</p></div>
    </section>
    <section class="library-panel" aria-labelledby="audioLibraryHeading">
      <h2 id="audioLibraryHeading">Ses arşivi</h2>
      <div id="savedAudio" class="library-list"><p class="empty">Henüz oluşturulmuş ses yok.</p></div>
    </section>
  </main>
  <script type="module" src="./halim-simple-ui.js"></script>
</body>
</html>
