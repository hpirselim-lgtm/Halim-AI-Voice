<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101522">
  <meta name="description" content="Halim'in kendi sesiyle Türkçe metin seslendirme uygulaması.">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <title>Halim AI Voice</title>
</head>
<body class="simple-voice-page">
  <main class="simple-voice-app">
    <header class="simple-voice-header">
      <div class="brand-mark" aria-hidden="true">HV</div>
      <h1>Halim AI Voice</h1>
    </header>
    <section class="simple-voice-panel" aria-label="Türkçe metin seslendirme">
      <div class="simple-voice-profile">
        <span class="simple-voice-avatar" aria-hidden="true">H</span>
        <span><strong>Halim'in sesi</strong><small>Sabit ses profili · Türkçe</small></span>
      </div>
      <label class="sr-only" for="speechText">Seslendirilecek Türkçe metin</label>
      <textarea id="speechText" rows="9" maxlength="12000" placeholder="Okutmak istediğin metni buraya yaz…"></textarea>
      <button class="button primary simple-voice-button" id="generateSpeechButton" type="button">Metni kendi sesimle oku</button>
      <p id="speechStatus" class="simple-voice-status" role="status" aria-live="polite">Halim'in ses profili kullanılacak.</p>
      <div id="generatedAudio" class="generated-audio" hidden></div>
    </section>
  </main>
  <script type="module" src="./halim-simple-ui.js"></script>
</body>
</html>
