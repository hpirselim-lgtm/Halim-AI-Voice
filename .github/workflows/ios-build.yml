name: iOS local voice engine build check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-build.yml'
      - 'scripts/ios/**'

permissions:
  contents: read

jobs:
  build-upstream-engine:
    name: Build Chatterbox Core ML iOS app (unsigned)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout Halim AI Voice
        uses: actions/checkout@v4

      - name: Checkout reviewed Chatterbox Core ML source
        run: |
          git clone https://github.com/iliasaz/chatterbox-coreml.git /tmp/chatterbox-coreml
          cd /tmp/chatterbox-coreml
          git checkout b8288834e783f3a6210757fbaf62f9014220bff9

      - name: Apply Halim AI Voice Turkish defaults
        run: python3 scripts/ios/apply-halim-turkish.py

      - name: Localize Halim AI Voice recording screen
        run: python3 scripts/ios/localize-create-voice.py

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift package dependencies
        working-directory: /tmp/chatterbox-coreml
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ChatterboxApp/ChatterboxApp.xcodeproj \
            -scheme ChatterboxApp

      - name: Build unsigned iOS app
        working-directory: /tmp/chatterbox-coreml
        run: |
          xcodebuild \
            -project ChatterboxApp/ChatterboxApp.xcodeproj \
            -scheme ChatterboxApp \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/halim-derived-data \
            CODE_SIGNING_ALLOWED=NO \
            INFOPLIST_KEY_CFBundleDisplayName="Halim AI Voice" \
            build

      - name: Package unsigned iOS app
        if: success()
        run: |
          APP_PATH="/tmp/halim-derived-data/Build/Products/Debug-iphoneos/ChatterboxApp.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="/tmp/halim-derived-data/Build/Products/Release-iphoneos/ChatterboxApp.app"
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" /tmp/Halim-AI-Voice-unsigned-app.zip

      - name: Upload unsigned iOS app artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Halim-AI-Voice-unsigned-ios-app
          path: /tmp/Halim-AI-Voice-unsigned-app.zip
          retention-days: 7

      - name: Report build output
        if: always()
        run: |
          if [ -d /tmp/halim-derived-data/Build/Products/Release-iphoneos/ChatterboxApp.app ]; then
            echo "Unsigned iOS app build output exists."
          elif [ -d /tmp/halim-derived-data/Build/Products/Debug-iphoneos/ChatterboxApp.app ]; then
            echo "Unsigned iOS app build output exists."
          else
            echo "No app bundle was produced. See build logs above."
            exit 1
          fi
